<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Manager</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f6f8;
            padding: 40px;
        }

        .container {
            max-width: 1000px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        h1 {
            text-align: center;
            margin-bottom: 25px;
            color: #222;
        }

        /* Add Task Section */
        .add-task {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
        }

        .add-task input {
            flex: 1;
            padding: 13px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 16px;
        }

        .task-meta {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .task-meta small {
            color: #666;
            font-size: 12px;
        }

        .add-task button {
            padding: 13px 25px;
            border: none;
            background: #2563eb;
            color: white;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
        }

        .add-task button:hover {
            background: #1d4ed8;
        }

        /* Statistics */
        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 25px;
        }

        .card {
            padding: 20px;
            text-align: center;
            border-radius: 8px;
            background: #eef2ff;
        }

        .card h3 {
            margin-bottom: 10px;
            color: #555;
        }

        .card p {
            font-size: 28px;
            font-weight: bold;
            color: #222;
        }

        /* Filter Buttons */
        .filters {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .filters button {
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            background: #e5e7eb;
            font-size: 14px;
        }

        .filters button:hover {
            background: #d1d5db;
        }

        /* Main Content */
        .content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 25px;
        }

        .task-list,
        .completed-section {
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 20px;
        }

        .task-list h2,
        .completed-section h2 {
            margin-bottom: 15px;
            color: #333;
        }

        /* Task Items */
        .task {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px;
            border-bottom: 1px solid #eee;
        }

        .task:last-child {
            border-bottom: none;
        }

        .task input {
            width: 18px;
            height: 18px;
            cursor: pointer;
        }

        .task.completed span {
            text-decoration: line-through;
            color: #888;
        }

        /* Table */
        table {
            width: 100%;
            border-collapse: collapse;
        }

        th,
        td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }

        th {
            background: #f3f4f6;
        }

        /* Responsive */
        @media (max-width: 700px) {
            body {
                padding: 15px;
            }

            .stats {
                grid-template-columns: 1fr;
            }

            .content {
                grid-template-columns: 1fr;
            }

            .add-task {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="container">

        <h1>Task Manager</h1>
        <div class="add-task">
            <input type="text" id="taskInput" placeholder="Enter your task">
            <input type="date" id="taskDate">
            <button onclick="addTask()">Add Task</button>
        </div>
        <div class="stats">
            <div class="card">
                <h3>Total Task</h3>
                <p id="totalTasks">2</p>
            </div>

            <div class="card">
                <h3>Completed</h3>
                <p id="completedTasks">0</p>
            </div>
            <div class="card">
                <h3>Pending</h3>
                <p id="pendingTasks">2</p>
            </div>
        </div>
        <div class="filters">
            <button onclick="filterTasks('all')">All</button>
            <button onclick="filterTasks('pending')">Pending</button>
            <button onclick="filterTasks('completed')">Completed</button>
        </div>
        <div class="content">
            <div class="task-list">
                <h2>My Tasks</h2>
                <div id="taskContainer">
                    <div class="task">
                        <input type="checkbox" onchange="updateTask(this)">
                        <span>ML Assignment</span>
                    </div>
                    <div class="task">
                        <input type="checkbox" onchange="updateTask(this)">
                        <span>Coding</span>
                    </div>
                </div>
            </div>
            <div class="completed-section">
                <h2>Completed Tasks</h2>
                <table>
                    <thead>
                        <tr>
                            <th>Task</th>
                            <th>Date</th>
                            <th>Status</th>
                        </tr>
                    </thead>
                    <tbody id="completedTable">
                    </tbody>
                </table>
            </div>
        </div>
    </div>
    <script>
        let tasks = [
            {
                name: "ML Assignment",
                date: "2026-08-27",
                completed: false
            },
            {
                name: "Coding",
                date: "2026-08-30",
                completed: false
            }
        ];

        function formatDate(dateString) {
            if (!dateString) return "No date";

            const date = new Date(dateString + "T00:00:00");

            return date.toLocaleDateString("en-GB", {
                day: "2-digit",
                month: "short",
                year: "numeric"
            });
        }

        function renderTasks(filter = "all") {

            const container = document.getElementById("taskContainer");

            container.innerHTML = "";

            tasks.forEach((task, index) => {

                if (filter === "completed" && !task.completed) return;

                if (filter === "pending" && task.completed) return;

                const div = document.createElement("div");

                div.className = "task";

                if (task.completed) {
                    div.classList.add("completed");
                }

                div.innerHTML = `
                    <input
                        type="checkbox"
                        ${task.completed ? "checked" : ""}
                        onchange="toggleTask(${index})"
                    >
                    <div class="task-meta">
                        <span>${task.name}</span>
                        <small>${formatDate(task.date)}</small>
                    </div>
                `;

                container.appendChild(div);

            });

            updateStats();

            renderCompletedTasks();
        }


        function addTask() {

            const input = document.getElementById("taskInput");
            const dateInput = document.getElementById("taskDate");

            const taskName = input.value.trim();
            const taskDate = dateInput.value;

            if (taskName === "") {

                alert("Please enter a task!");

                return;
            }

            if (!taskDate) {
                alert("Please select a date!");
                return;
            }

            tasks.push({
                name: taskName,
                date: taskDate,
                completed: false
            });

            input.value = "";
            dateInput.value = "";

            renderTasks();

        }


        function toggleTask(index) {

            tasks[index].completed = !tasks[index].completed;

            renderTasks();

        }


        function filterTasks(type) {

            renderTasks(type);

        }


        function updateStats() {

            const total = tasks.length;

            const completed = tasks.filter(
                task => task.completed
            ).length;

            const pending = total - completed;

            document.getElementById("totalTasks").textContent = total;

            document.getElementById("completedTasks").textContent = completed;

            document.getElementById("pendingTasks").textContent = pending;

        }


        function renderCompletedTasks() {

            const table = document.getElementById("completedTable");

            table.innerHTML = "";

            tasks.forEach(task => {

                if (task.completed) {

                    const row = document.createElement("tr");

                    row.innerHTML = `
                        <td>${task.name}</td>
                        <td>${formatDate(task.date)}</td>
                        <td>Completed</td>
                    `;

                    table.appendChild(row);

                }

            });

        }


        // Initial display
        renderTasks();

    </script>

</body>
</html>
```
